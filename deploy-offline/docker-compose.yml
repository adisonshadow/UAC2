services:
  eadaf-web:
    image: nginx:1.25-alpine
    container_name: EADAF-web
    restart: unless-stopped
    ports:
      - "9527:9527"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      eadaf-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9527/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  eadaf-api:
    image: eadaf-api:v1
    container_name: EADAF-api
    restart: unless-stopped
    ports:
      - "9526:9526"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_HOST: "0.0.0.0"
      API_PORT: "9526"
      LOG_FILE: /data/logs/app.log
      STORAGE_ROOT: /data/upload
      IMG_CROP_CACHE_DIR: /data/img_crop_cache
      DB_BACKUP_DIR: /data/db-backup
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./logs/api:/data/logs
      - eadaf_upload_data:/data/upload
      - eadaf_img_crop_cache:/data/img_crop_cache
      - eadaf_db_backup:/data/db-backup
      - ./.env:/app/backend/.env.production:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9526/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  fpcu2-bff:
    image: fpcu2-bff:v1
    container_name: FPCU2-bff
    restart: unless-stopped
    ports:
      - "13303:13303"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      EADAF_API_BASE_URL: http://eadaf-api:9526
      EADAF_FRONTEND_URL: ${EADAF_PUBLIC_URL:-http://localhost:9527}
      FPCU2_DATA_STORE: eadaf
      EADAF_CONTRACT_CHECK: "false"
      BFF_PORT: "13303"
      SSO_CALLBACK_URL: ${SSO_CALLBACK_URL:-http://localhost:13303/auth/callback}
      BFF_CORS_ORIGIN: ${FPCU2_PUBLIC_URL:-http://localhost:13308}
      FRONTEND_URL: ${FPCU2_PUBLIC_URL:-http://localhost:13308}
      # 非本地 Mock 比对接口调试流水（单文件按时间追加）
      JZ_COMPARE_FLOW_LOG: /data/logs/jz-compare-flow.log
    volumes:
      - ./logs/fpcu2-bff:/data/logs
    depends_on:
      eadaf-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:13303/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  fpcu2-web:
    image: fpcu2-web:v1
    container_name: FPCU2-web
    restart: unless-stopped
    ports:
      - "13308:13308"
    environment:
      LISTEN_PORT: "13308"
      FPCU2_BFF_UPSTREAM: fpcu2-bff:13303
      EADAF_PUBLIC_URL: ${EADAF_PUBLIC_URL:-http://localhost:9527}
      FPCU2_SSO_APPLICATION_ID: ${FPCU2_APPLICATION_ID:-10000000-0001-4000-8000-000000006666}
    volumes:
      - ./logs/fpcu2-nginx:/var/log/nginx
    depends_on:
      fpcu2-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:13308/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: EADAF-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-35432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-eadaf_db}
      POSTGRES_USER: ${POSTGRES_USER:-my_name}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - EADAF_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my_name} -d ${POSTGRES_DATABASE:-eadaf_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: EADAF-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-36379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - EADAF_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: EADAF-mysql
    restart: always
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bizdata}
    volumes:
      - EADAF_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  EADAF_postgres_data:
  EADAF_redis_data:
  EADAF_mysql_data:
  eadaf_upload_data:
  eadaf_img_crop_cache:
  eadaf_db_backup:
