services:
  postgres:
    image: postgres:16-alpine
    container_name: EADAF-dev-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-eadaf_db}
      POSTGRES_USER: ${POSTGRES_USER:-my_name}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - EADAF_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my_name} -d ${POSTGRES_DATABASE:-eadaf_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: EADAF-dev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-26379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - EADAF_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  EADAF_postgres_data:
  EADAF_redis_data:
